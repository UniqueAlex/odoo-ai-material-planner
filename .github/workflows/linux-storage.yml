name: Linux credential-store checks
on:
  push:
    branches: ["19.0"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  store:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Odoo supplies pytz; this standalone test runner has no Odoo installation.
      - run: python -m pip install -r requirements.txt pytz
      - run: python tests/test_storage.py -v
      - run: python tests/test_ai_identity_usage.py -v
